<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Longcours</title>
<link rel="manifest" href="manifest.json?v=3">
<meta name="theme-color" content="#D97706">
<meta name="mobile-web-app-capable" content="yes">
<!-- Apple / iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Longcours">
<!-- ?v=2 (2026-08-22) : casse le cache navigateur/PWA sur les anciennes icônes
     rognées/zoomées, pour forcer le chargement des nouveaux fichiers corrigés. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- PERF (2026-08-24) : preconnect vers Supabase pour démarrer la poignée de
     main TLS pendant que le HTML/CSS se chargent encore, avant même le
     premier appel d'authentification. Gain surtout sensible en connexion
     lente/mobile (évite un aller-retour DNS+TLS complet au moment critique
     du login/PIN). -->
<link rel="preconnect" href="https://auupearmsktllnufhqha.supabase.co" crossorigin>
<!-- PERF (2026-08-24) : la feuille de police Google Fonts était chargée en
     <link rel="stylesheet"> classique, ce qui bloque le rendu de la page
     tant qu'elle n'est pas téléchargée. On la charge maintenant en
     asynchrone (preload + bascule en stylesheet une fois prête) pour que
     l'écran de démarrage s'affiche immédiatement, avec repli <noscript>
     pour les cas sans JS. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet"></noscript>
<!-- PERF (2026-08-24) : préchargement du script Supabase pendant le parsing
     du HTML/CSS ; le <script> réel a été déplacé juste avant le script
     principal de l'app (voir plus bas), pour ne plus bloquer l'affichage
     des écrans (splash/login/etc.) derrière un fichier externe. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
<style>
  :root{
    --cream:#FFF7E9;
    --cream-deep:#FCEBC9;
    --ink:#2B1810;
    --ink-soft:#6B5644;
    --gold:#F5B942;
    --gold-deep:#D97706;
    --orange:#F2661D;
    --green:#1E9E4A;
    --green-deep:#0F7A37;
    --red:#E63946;
    --white:#FFFFFF;
    --blue:#3B82F6;
    --purple:#8B5CF6;
    --shadow: 0 10px 30px rgba(43,24,16,0.12);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #FFE8B8 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #FFD9C2 0%, transparent 50%),
      var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 12px;
    color:var(--ink);
  }
  h1,h2,h3,.font-display{font-family:'Baloo 2',sans-serif;}
  button{font-family:inherit;}
  /* ---------- Support RTL (arabe) — AJOUTÉ 2026-08-20 ----------
     dir="rtl" (posé par applyLanguage()) inverse déjà nativement le sens du
     texte et la plupart des flex-row. On corrige ici les quelques endroits
     où un sens fixe (gauche/droite) est explicitement voulu quel que soit
     la langue : positions fixes des boutons flottants, icônes de
     navigation/retour, et bandeau de notification. */
  body.lang-rtl #pwaInstallFab,
  body.lang-rtl #pwaInstallBanner{ direction:ltr; }
  body.lang-rtl .lucky-claim-btn span,
  body.lang-rtl .withdraw-sheet-head button[aria-label="Retour"]{ transform:scaleX(-1); }
  body.lang-rtl .ad-slot-dots{ direction:ltr; }
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .demo-tag{
    font-family:'Baloo 2',sans-serif;
    background:var(--ink);
    color:var(--gold);
    padding:7px 18px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.04em;
    box-shadow:var(--shadow);
  }
  .phone{
    position:relative;
    width:390px;
    max-width:94vw;
    height:820px;
    max-height:88vh;
    background:linear-gradient(160deg,#241209,#3a2013);
    border-radius:46px;
    padding:14px;
    box-shadow: 0 30px 60px rgba(43,24,16,0.35), 0 0 0 2px rgba(0,0,0,0.06) inset;
  }
  .phone-notch{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:120px;height:22px;background:#241209;border-radius:0 0 16px 16px;z-index:30;
  }
  .app{
    position:relative;
    width:100%;height:100%;
    background:var(--cream);
    border-radius:32px;
    overflow:hidden;
    display:flex;flex-direction:column;
    /* Réserve la zone de la barre de statut/encoche du téléphone : sans ça, le
       contenu qui défile (bannières, boutons) peut se retrouver caché derrière
       elle en haut d'écran, sur mobile réel. */
    padding-top:env(safe-area-inset-top,0px);
  }
  .screen{
    position:relative;
    display:none;
    flex-direction:column;
    height:100%;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    -ms-overflow-style:none;scrollbar-width:none;
    /* Espace réel sous le contenu : la barre de navigation est flottante,
       donc chaque écran doit pouvoir défiler au-delà de sa hauteur. */
    padding-bottom:calc(230px + env(safe-area-inset-bottom,0px)) !important;
    scroll-padding-bottom:calc(230px + env(safe-area-inset-bottom,0px));
    animation:fadeSlide .35s ease;
  }
  .screen::-webkit-scrollbar{display:none;}
  .screen.active{display:flex;}
/* VOL ROUGE — CORRECTIF GLOBAL 2026-09-04
   Un seul scroll pour tout l'espace + marge de sécurité sous les contrôles.
   La barre de navigation ne doit jamais recouvrir le jeu. */
.volrouge-frame-wrap{
  position:relative;
  width:100%;
  height:900px;
  min-height:900px;
  margin:0 0 180px;
  overflow:visible;
}
.volrouge-frame{
  display:block;
  width:100%;
  height:100%;
  min-height:0;
  border:0;
  border-radius:20px;
  background:transparent;
  overflow:hidden;
}
#screen-play{
  padding-bottom:calc(210px + env(safe-area-inset-bottom,0px)) !important;
}
#screen-play #playContent,
#screen-play #playMatchesContent{
  padding-bottom:40px;
}
@media (max-width:430px){
  .volrouge-frame-wrap{
    height:1000px;
    min-height:1000px;
    margin-bottom:190px;
  }
}
.volrouge-frame{min-height:760px;height:760px;}
}

  /* Empêche les cartes de se comprimer quand le contenu dépasse la hauteur visible :
     sans ça, les enfants flex se réduisent au lieu de laisser le scroll s'activer,
     ce qui écrase/entrelace les textes des cartes (bug Profil / Mentor). */
  .screen > *{flex-shrink:0;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 10px;
    flex-shrink:0;
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;}
  .logo-ball{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff, var(--gold) 45%, var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;color:var(--green-deep);font-size:15px;
    box-shadow:0 3px 8px rgba(217,119,6,0.4);
    overflow:hidden;
  }
  /* AJUSTÉ (2026-08-22) : nouveau logo Longcours (image), affiché en rond
     dans le petit emblème de la barre du haut. object-fit:contain garantit
     que le logo s'affiche EN ENTIER (aucun rognage/zoom), quitte à laisser
     un léger espace dans le cercle, contrairement à "cover" qui recadrait
     et coupait une partie du visuel. */
  .logo-ball img{width:100%;height:100%;object-fit:contain;padding:2px;border-radius:50%;display:block;}
  .brand-name{font-family:'Baloo 2';font-weight:700;font-size:18px;color:var(--ink);}
  .topbar-actions{display:flex;align-items:center;gap:9px;}

  /* ---------- Wallet chip ---------- */
  .wallet-chip{
    position:relative;display:flex;align-items:center;gap:7px;
    background:linear-gradient(135deg,#2B1810 0%,#4a2a15 55%,#7a4420 100%);
    border:1px solid rgba(245,185,66,0.45);
    border-radius:999px;padding:6px 13px 6px 6px;cursor:pointer;
    box-shadow:0 6px 16px rgba(217,119,6,0.38), inset 0 1px 0 rgba(255,255,255,0.12);
    overflow:hidden;transition:transform .15s ease, box-shadow .15s ease;
    animation:walletFloat 3.2s ease-in-out infinite;
  }
  .wallet-chip:active{transform:scale(0.94);}
  .wallet-chip::after{
    content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,0.55),transparent);
    transform:skewX(-20deg);animation:walletShine 3.2s ease-in-out infinite;
  }
  @keyframes walletShine{
    0%{left:-60%;}
    35%{left:130%;}
    100%{left:130%;}
  }
  @keyframes walletFloat{
    0%,100%{box-shadow:0 6px 16px rgba(217,119,6,0.38), inset 0 1px 0 rgba(255,255,255,0.12);}
    50%{box-shadow:0 6px 20px rgba(245,185,66,0.55), inset 0 1px 0 rgba(255,255,255,0.18);}
  }
  .wallet-chip-coin{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #eafff5, #26A17B 55%, #0d5c40 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:11px;color:#fff;
    box-shadow:0 2px 6px rgba(38,161,123,0.5);
  }
  .wallet-chip-text{display:flex;flex-direction:column;line-height:1.05;}
  .wallet-chip-amt{font-family:'Baloo 2';font-weight:800;font-size:12.5px;color:var(--gold);white-space:nowrap;}
  .wallet-chip-lbl{font-size:8.5px;color:#e8d9c8;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
  .wallet-chip-chev{font-size:11px;color:var(--gold);opacity:.85;margin-left:1px;}

  .bell-wrap{position:relative;cursor:pointer;}
  .bell-btn{
    width:38px;height:38px;border-radius:50%;background:var(--white);border:none;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:var(--shadow); cursor:pointer;
  }
  .topbar-close{
    width:36px;height:36px;border-radius:50%;background:var(--white);border:none;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
    color:var(--ink-soft); box-shadow:var(--shadow); cursor:pointer; flex-shrink:0;
  }
  .topbar-close:active{transform:scale(0.94);}
  .bell-dot{
    position:absolute;top:0;right:0;width:10px;height:10px;background:var(--red);
    border-radius:50%;border:2px solid var(--cream);display:none;
  }
  .notif-panel{
    position:absolute; top:44px; right:0; width:260px; background:var(--white);
    border-radius:var(--radius-md); box-shadow:var(--shadow); padding:10px; z-index:50;
    display:none; max-height:280px; overflow-y:auto;
  }
  .notif-panel.open{display:block;}
  .notif-item{padding:9px 10px;border-radius:10px;font-size:12.5px;line-height:1.4;position:relative;}
  .notif-item:nth-child(odd){background:var(--cream);}
  .notif-item.unread::before{content:'';position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--red);}
  .notif-item-title{font-weight:800;margin-bottom:2px;}
  .notif-empty{padding:14px;text-align:center;color:var(--ink-soft);font-size:12.5px;}

  /* CHAT SUPPORT (2026-08-25) : overlay plein écran, ouvert depuis le
     portefeuille/dépôt, avec polling ~4s pour un rendu quasi temps réel. */
  .support-chat-overlay{
    position:fixed; inset:0; background:var(--cream); z-index:200;
    display:none; flex-direction:column;
  }
  .support-chat-overlay.open{display:flex;}
  .support-chat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--white); box-shadow:var(--shadow);
    flex-shrink:0;
  }
  .support-chat-header h3{margin:0;font-size:15px;}
  .support-chat-close{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}
  .support-chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;}
  .support-msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.4;word-wrap:break-word;}
  .support-msg.from-user{align-self:flex-end;background:var(--accent, #D97706);color:#fff;border-bottom-right-radius:4px;}
  .support-msg.from-admin{align-self:flex-start;background:var(--white);border-bottom-left-radius:4px;box-shadow:var(--shadow);}
  .support-msg-time{font-size:10px;opacity:.65;margin-top:3px;}
  .support-chat-empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:30px 20px;}
  .support-chat-input-row{
    display:flex; gap:8px; padding:10px 12px; background:var(--white);
    border-top:1px solid rgba(0,0,0,.06); flex-shrink:0;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .support-chat-input-row textarea{
    flex:1; resize:none; border-radius:16px; border:1px solid rgba(0,0,0,.12);
    padding:9px 14px; font-size:13px; font-family:inherit; max-height:80px;
  }
  .support-chat-send{
    background:var(--accent, #D97706); color:#fff; border:none; border-radius:50%;
    width:40px; height:40px; flex-shrink:0; font-size:16px; cursor:pointer;
  }
  .support-chat-send:disabled{opacity:.5;}
  .deposit-support-btn{
    display:flex; align-items:center; gap:10px; width:100%; margin-top:14px;
    background:var(--white); border:1px solid rgba(0,0,0,.08); border-radius:14px;
    padding:13px 14px; font-size:13px; font-weight:700; color:inherit;
    box-shadow:var(--shadow); cursor:pointer; position:relative; text-align:left;
  }
  .deposit-support-btn .icon{font-size:20px;}
  .deposit-support-btn .sub{font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .deposit-support-dot{
    position:absolute; top:10px; right:12px; width:9px; height:9px; border-radius:50%;
    background:var(--red); display:none;
  }

  /* ============================================================
     DM CHAT (2026-09-07) : messagerie entre users (recherche par
     pseudo/email, texte temps réel, messages vocaux, appels
     audio/vidéo WebRTC). Thème sombre dédié, indépendant du chat
     support (.support-chat-*) qui reste inchangé. Préfixe "dm-".
     ============================================================ */
  :root{
    --dm-bg:#0B0F1A; --dm-surface:#111726; --dm-surface2:#182036; --dm-border:#1E2740;
    --dm-out:#6C5CE8; --dm-out-text:#F3F1FF; --dm-in:#1B2438; --dm-in-text:#E7E9F2;
    --dm-text:#EDEFF5; --dm-muted:#8890A6; --dm-muted-soft:#5B6478; --dm-online:#3ED9A3; --dm-danger:#FF5D6C;
  }
  .messages-entry-btn{ position:relative; background:none; border:none; font-size:20px; cursor:pointer; padding:6px; color:inherit; }
  .nav-item[data-screen="screen-messages"]{ position:relative; }
  .nav-item .messages-nav-dot{ position:absolute; top:2px; right:22%; width:8px; height:8px; border-radius:50%; background:var(--red); display:none; }
  .messages-entry-dot{ position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--dm-danger); display:none; }

  .dm-screen{ background:var(--cream); min-height:100%; }
  .dm-search-row{ display:flex; gap:8px; padding:12px 14px; align-items:center; }
  .dm-search-row input{
    flex:1; border-radius:16px; border:1px solid rgba(0,0,0,.12); padding:10px 14px;
    font-size:13.5px; font-family:inherit; background:var(--white);
  }
  .dm-search-results{ padding:0 14px 8px; display:flex; flex-direction:column; gap:6px; }
  .dm-user-row{
    display:flex; align-items:center; gap:10px; background:var(--white); border-radius:14px;
    padding:10px 12px; box-shadow:var(--shadow); cursor:pointer;
  }
  .dm-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--gold-deep); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
    position:relative;
  }
  .dm-avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .dm-avatar.online::after{
    content:''; position:absolute; right:-1px; bottom:-1px; width:11px; height:11px;
    border-radius:50%; background:#2ECC71; border:2px solid var(--dm-surface);
  }
  .dm-chat-header .dm-avatar.online::after{ width:10px; height:10px; }
  .dm-user-row .nm{ font-weight:700; font-size:13.5px; }
  .dm-user-row .em{ font-size:11.5px; color:var(--ink-soft); }
  .dm-conv-list{ padding:4px 14px 20px; display:flex; flex-direction:column; gap:6px; }
  .dm-conv-row{ position:relative; }
  .dm-conv-row .sub{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }
  .dm-conv-time{ margin-left:auto; font-size:10.5px; color:var(--ink-soft); flex-shrink:0; }
  .dm-conv-unread{ margin-left:6px; background:var(--red); color:#fff; border-radius:10px; font-size:10px; padding:2px 6px; flex-shrink:0; }
  .dm-empty{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding:30px 20px; }

  .dm-chat-overlay{ position:fixed; inset:0; background:var(--dm-bg); z-index:210; display:none; flex-direction:column; font-family:'Nunito',sans-serif; color:var(--dm-text); }
  .dm-chat-overlay.open{ display:flex; }
  .dm-chat-header{ display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--dm-border); background:var(--dm-surface); flex-shrink:0; }
  .dm-chat-header button{ background:none; border:none; color:var(--dm-text); cursor:pointer; padding:6px; font-size:19px; }
  .dm-chat-header button:disabled{ opacity:.35; cursor:not-allowed; }
  .dm-chat-header .dm-avatar{ width:38px; height:38px; font-size:13px; }
  .dm-chat-title{ flex:1; min-width:0; }
  .dm-chat-title .nm{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dm-chat-title .st{ font-size:11.5px; color:var(--dm-muted); }
  .dm-chat-messages{
    flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:2px;
    background-color:var(--dm-bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(108,92,232,.06) 0, transparent 40%),
      radial-gradient(circle at 92% 82%, rgba(108,92,232,.05) 0, transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 26px);
  }
  .dm-bubble-wrap{ max-width:78%; display:flex; flex-direction:column; margin:3px 0; position:relative; }
  .dm-bubble-wrap.out{ align-self:flex-end; }
  .dm-bubble-wrap.in{ align-self:flex-start; }
  .dm-bubble{ padding:8px 13px; border-radius:15px; font-size:14.5px; line-height:1.4; word-break:break-word; box-shadow:0 1px 1px rgba(0,0,0,.15); position:relative; white-space:pre-wrap; }
  .dm-bubble.out{ background:var(--dm-out); color:var(--dm-out-text); border-bottom-right-radius:3px; }
  .dm-bubble.in{ background:var(--dm-in); color:var(--dm-in-text); border-bottom-left-radius:3px; }
  /* Petite "queue" de bulle façon WhatsApp, uniquement sur le premier message d'un groupe */
  .dm-bubble-wrap.out.first .dm-bubble.out::after{
    content:''; position:absolute; right:-6px; bottom:0; width:12px; height:14px;
    background:var(--dm-out); clip-path:polygon(0 0, 0% 100%, 100% 100%);
  }
  .dm-bubble-wrap.in.first .dm-bubble.in::after{
    content:''; position:absolute; left:-6px; bottom:0; width:12px; height:14px;
    background:var(--dm-in); clip-path:polygon(100% 0, 0% 100%, 100% 100%);
  }
  .dm-bubble-meta{ display:flex; align-items:center; gap:4px; margin-top:3px; font-size:11px; color:var(--dm-muted-soft); }
  .dm-bubble-wrap.out .dm-bubble-meta{ align-self:flex-end; }
  .dm-tick{ display:inline-flex; font-size:13px; line-height:1; letter-spacing:-2px; color:var(--dm-muted-soft); }
  .dm-tick.read{ color:#5BC7FF; }

  @keyframes dmSpin{ to{ transform:rotate(360deg); } }

  .dm-day-sep{ align-self:center; background:rgba(255,255,255,.06); color:var(--dm-muted); font-size:11px; font-weight:700; padding:4px 12px; border-radius:10px; margin:10px 0; }

  .dm-online-dot{ position:absolute; width:10px; height:10px; border-radius:50%; background:var(--dm-online); border:2px solid var(--dm-surface); bottom:0; right:0; display:none; }
  .dm-chat-header .dm-avatar{ position:relative; }

  .dm-chat-input-row{ border-top:1px solid var(--dm-border); background:var(--dm-surface); padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); flex-shrink:0; display:flex; align-items:center; gap:6px; position:relative; }
  .dm-emoji-btn{ background:none; border:none; font-size:21px; cursor:pointer; padding:4px 2px; flex-shrink:0; line-height:1; }
  .dm-emoji-picker{
    position:absolute; left:8px; right:8px; bottom:100%; margin-bottom:8px; background:var(--dm-surface);
    border:1px solid var(--dm-border); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.18);
    display:grid; grid-template-columns:repeat(8, 1fr); gap:2px; padding:10px; max-height:190px; overflow-y:auto; z-index:5;
  }
  .dm-emoji-picker button{ background:none; border:none; font-size:22px; padding:6px 0; cursor:pointer; border-radius:8px; line-height:1; }
  .dm-emoji-picker button:active{ background:rgba(0,0,0,.08); }
  .dm-chat-input-row input[type=text]{ flex:1; background:var(--dm-surface2); border:none; outline:none; border-radius:22px; padding:10px 16px; color:var(--dm-text); font-size:14.5px; font-family:inherit; }
  .dm-attach-btn{ width:40px; height:40px; border-radius:50%; border:none; background:none; color:var(--dm-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:20px; }
  .dm-attach-btn:active{ background:var(--dm-surface2); }
  .dm-send-btn{ width:40px; height:40px; border-radius:50%; border:none; background:var(--dm-out); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:16px; }
  .dm-rec-indicator{ flex:1; display:flex; align-items:center; gap:10px; background:var(--dm-surface2); border-radius:22px; padding:9px 16px; }
  .dm-rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--dm-danger); animation:dmBlink 1s infinite; }
  @keyframes dmBlink{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .dm-call-overlay{ position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #232f4d 0%, var(--dm-bg) 70%); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:56px 24px 40px; z-index:3000; }
  .dm-call-avatar{ width:112px; height:112px; border-radius:50%; background:var(--dm-out); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#fff; overflow:hidden; }
  .dm-call-avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .dm-call-name{ font-size:20px; font-weight:700; margin-top:14px; }
  .dm-call-status{ font-size:14px; color:var(--dm-muted); margin-top:6px; }
  .dm-call-actions{ display:flex; gap:20px; }
  .dm-call-btn{ width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; }
  .dm-call-btn.accept{ background:var(--dm-online); color:#08351f; }
  .dm-call-btn.decline{ background:var(--dm-danger); color:#fff; }
  .dm-call-btn.end{ background:var(--dm-danger); color:#fff; }
  .dm-call-btn.mute{ background:rgba(255,255,255,.12); color:#fff; }

  .dm-call-btn.cam{ background:rgba(255,255,255,.12); color:#fff; }
  .dm-call-btn.cam.active{ background:#fff; color:#232f4d; }
  /* AJOUT (2026-09-08) : bouton bibliothèque vidéos admin + feuille de

  .dm-call-btn.admin-video{ background:rgba(255,255,255,.12); color:#fff; }

  .dm-admin-video-item.playing{ outline:2px solid var(--purple); }
  /* AJOUT : sélection OBLIGATOIRE d'une vidéo avant un appel vidéo admin —
     voir dmRequireAdminCallVideo. Plein écran, au-dessus de dm-call-overlay
     (z-index supérieur), sans bouton "fermer" : seul un choix ou l'annulation
     de l'appel permet de continuer. */
  .dm-admin-video-required-overlay{
    position:fixed; inset:0; z-index:3500;

    display:flex; align-items:flex-end; justify-content:center;
  }

  .dm-admin-stop-btn{

  .dm-call-video video{ width:100%; height:100%; object-fit:cover; }
  .dm-call-video video.local{ position:absolute; width:100px; height:140px; bottom:110px; right:16px; border-radius:12px; object-fit:cover; box-shadow:0 4px 16px rgba(0,0,0,.4); }

  /* AJOUT (2026-09-01) : variante captivante et animée du bouton Épargne
     (dégradé doré qui bouge, halo pulsé, icône qui respire, étincelle),
     pour le distinguer des autres boutons "deposit-support-btn" classiques. */
  .epargne-cta{
    background:linear-gradient(120deg, var(--gold-deep), var(--gold) 45%, var(--orange) 100%);
    background-size:200% 200%;
    border:none;
    color:var(--white);
    animation:epargneShine 3s ease-in-out infinite, epargneGlow 2.2s ease-in-out infinite;
    box-shadow:0 10px 26px rgba(217,119,6,0.45);
  }
  .epargne-cta .sub{color:rgba(255,255,255,0.9);}
  .epargne-cta .icon{display:inline-flex;animation:epargneBounce 1.6s ease-in-out infinite;}
  .epargne-cta::after{
    content:"\2728"; position:absolute; top:10px; right:14px; font-size:15px;
    animation:epargneSparkle 1.8s ease-in-out infinite;
  }
  @keyframes epargneShine{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  @keyframes epargneGlow{0%,100%{box-shadow:0 10px 26px rgba(217,119,6,0.45);}50%{box-shadow:0 10px 34px rgba(245,185,66,0.75);}}
  @keyframes epargneBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-2px) scale(1.12);}}
  @keyframes epargneSparkle{0%,100%{opacity:.4;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}

  .section-pad{padding:0 20px;}

  /* MARKETPLACE (2026-08-26) : remplace l'ancien onglet "Résultats" de la

  .marketplace-search-row{padding:10px 20px 4px;}

    width:100%;padding:11px 16px;border-radius:14px;border:1px solid rgba(0,0,0,.1);
    background:var(--white);font-size:13px;font-family:inherit;

  .marketplace-trial-hero{
    margin:12px 20px 4px;padding:16px 16px 14px;border-radius:var(--radius-md);

  /* ---------- Buttons ---------- */
  .btn{
    border:none;border-radius:999px;padding:15px 20px;font-weight:800;
    font-family:'Baloo 2';font-size:16px;cursor:pointer;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease;

  .btn-secondary{background:var(--white);color:var(--ink);box-shadow:var(--shadow);}

  .input{
    width:100%;padding:15px 16px;border-radius:var(--radius-sm);border:2px solid #F1DFB8;
    background:var(--white);font-size:16px;font-weight:700;color:var(--ink);

  .field-hint{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:6px;}
  .field-hint.err{color:var(--red);}

  /* ---------- Splash ---------- */
  #screen-splash{align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 30px;}
  .splash-ball{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #fff, var(--gold) 42%, var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:52px;color:var(--green-deep);
    box-shadow:0 16px 30px rgba(217,119,6,0.4);
    animation:bounceIn 1s cubic-bezier(.34,1.56,.64,1);
  }
  /* CORRIGÉ (2026-08-22) : écran "langue" et écran "PIN / verrouillage"
     affichaient encore un rond doré générique avec la lettre "L" codée en
     dur, jamais remplacée par le vrai logo. .splash-ball-logo affiche
     désormais le logo Longcours réel, entier (object-fit:contain, sans
     rognage ni zoom), dans le même rond que ces écrans utilisaient. */
  .splash-ball-logo{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #fff, var(--gold) 42%, var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 16px 30px rgba(217,119,6,0.4);
    animation:bounceIn 1s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
  }
  .splash-ball-logo img{width:82%;height:82%;object-fit:contain;display:block;}
  /* RESTAURÉ (2026-08-21) : nouveau logo Longcours (image) sur l'écran de
     démarrage, à la place du rond doré générique. max-width/height +
     object-fit:contain garantissent un affichage propre sur tous les
     formats d'écran, sans jamais déformer ni déborder. */
  .splash-hero{
    width:100%;max-width:280px;height:auto;max-height:38vh;object-fit:contain;
    animation:bounceIn 1s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 14px 26px rgba(217,119,6,0.35));
  }
  @keyframes bounceIn{0%{transform:scale(0) translateY(-40px);opacity:0}60%{transform:scale(1.1) translateY(10px);opacity:1}100%{transform:scale(1) translateY(0)}}
  .splash-title{font-size:30px;font-weight:800;margin:0;}
  .splash-sub{color:var(--ink-soft);font-weight:700;font-size:14.5px;margin:0;line-height:1.5;}
  .splash-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px;}

  /* ---------- Auth ---------- */
  .auth-wrap{padding:26px 24px;display:flex;flex-direction:column;height:100%;}
  .step-dots{display:flex;gap:6px;margin-bottom:18px;}
  .step-dot{width:26px;height:6px;border-radius:99px;background:#F1DFB8;}

  .network-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px;}
  .network-card{
    background:var(--white);border-radius:var(--radius-sm);padding:14px 6px;text-align:center;
    box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;font-weight:800;font-size:13px;

  .pin-dots{display:flex;gap:14px;justify-content:center;margin:22px 0;}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;}

  .ref-reveal{

  }
  .ref-code{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--gold-deep);letter-spacing:.05em;margin:6px 0;}

  /* ---------- Home ---------- */
  .trust-banner{
    margin:14px 20px 0;background:linear-gradient(135deg,var(--ink),#4a2a15);color:#fff;
    border-radius:var(--radius-md);padding:16px 18px;display:flex;align-items:center;gap:12px;
  }
  .trust-banner .amt{font-family:'Baloo 2';font-weight:800;font-size:19px;color:var(--gold);}
  .trust-banner .lbl{font-size:11.5px;color:#e8d9c8;font-weight:700;}
  
  .recovery-card{
    margin:14px 20px 0;background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:var(--green-deep);
    border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:13px;

    position:relative;margin:14px 20px 0;border-radius:calc(var(--radius-lg) + 4px);padding:3px;
    background:linear-gradient(120deg,#34D399,#16A34A,#A3E635,#34D399);
    background-size:300% 300%;animation:luckyFrameShimmer 6s ease infinite;
    box-shadow:0 12px 26px rgba(22,163,74,0.4);
  }
  @keyframes luckyFrameShimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .daily-lucky-inner{
    position:relative;overflow:hidden;
    background:linear-gradient(155deg,#0B3D24,#146C3B 55%,#0B2B1C);
    border-radius:calc(var(--radius-lg) + 1px);padding:18px 16px 16px;color:#fff;

  /* Filigrane feuille d'érable, discret, façon carnet de voyage */
  .daily-lucky-watermark{
    position:absolute;font-size:110px;opacity:.08;right:-18px;bottom:-22px;z-index:1;
    pointer-events:none;transform:rotate(-12deg);line-height:1;
  }
  .lucky-sparkle{position:absolute;font-size:13px;opacity:.8;animation:sparkleTwinkle 2s ease-in-out infinite;}
  @keyframes sparkleTwinkle{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  .lucky-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
  .lucky-orb-wrap{position:relative;width:70px;height:70px;flex-shrink:0;}
  .lucky-orb-ring{
    position:absolute;inset:-5px;border-radius:50%;

  @keyframes spinRing{to{transform:rotate(360deg);}}
  .lucky-orb{
    position:absolute;inset:4px;z-index:2;border-radius:50%;
    background:radial-gradient(circle at 32% 26%,#fff,#f1f5f4 55%,#d7ded9 100%);

  .lucky-info{text-align:left;position:relative;z-index:2;flex:1;min-width:0;}
  .lucky-info .ltitle{font-family:'Baloo 2';font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;}
  .lucky-info .lsub{font-size:11px;color:#bcf0d4;font-weight:700;margin-top:2px;}
  .lucky-info .lstatus{font-size:11.5px;font-weight:800;margin-top:4px;color:#FDE68A;}
  .lucky-info .lstatus.won{color:#86efac;}
  .lucky-claim-btn{

    padding:13px 18px;font-family:'Baloo 2';font-weight:800;font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;color:#1a1035;
    background:linear-gradient(135deg,#FDE68A,var(--gold) 55%,var(--orange));

    animation:claimBtnPulse 1.6s ease-in-out infinite;
  }
  .lucky-claim-btn::before{
    content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;

  }
  @keyframes claimBtnPulse{
    0%,100%{box-shadow:0 8px 20px rgba(245,185,66,0.5),0 0 0 0 rgba(245,185,66,0.55);}

  }
  .lucky-claimed-row{

    background:rgba(134,239,172,0.14);border:1.5px solid rgba(134,239,172,0.35);

  .lucky-streak-row{display:flex;align-items:center;gap:5px;margin-top:14px;justify-content:flex-start;position:relative;z-index:2;flex-wrap:wrap;}
  .lucky-streak-dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.12);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}

  .surprise-card{
    margin:14px 20px 0;border-radius:var(--radius-lg);padding:20px 16px;text-align:center;
    background:linear-gradient(135deg,#B3282D,#7A1518);color:#fff;box-shadow:0 12px 26px rgba(179,40,45,0.4);
    position:relative;overflow:hidden;

  @keyframes balloonFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
  .surprise-card .stitle{font-family:'Baloo 2';font-weight:800;font-size:17px;margin-top:6px;}

  .section-title{font-family:'Baloo 2';font-weight:700;font-size:17px;margin:20px 20px 10px;display:flex;align-items:center;justify-content:space-between;}

  /* ---------- Challenge banner (défi captivant, jackpot) ---------- */
  .challenge-banner{
    position:relative;overflow:hidden;text-align:center;
    margin:14px 20px 16px;padding:20px 18px 18px;

  .challenge-banner::before{

    background:radial-gradient(circle at 18% 0%, rgba(245,185,66,0.35), transparent 55%),
               radial-gradient(circle at 90% 100%, rgba(30,158,74,0.25), transparent 55%);

  @keyframes challengeGlow{0%,100%{opacity:.7;}50%{opacity:1;}}
  .challenge-banner::after{
    content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.18),transparent);
    transform:skewX(-20deg);animation:challengeShine 4.5s ease-in-out infinite;pointer-events:none;
  }
  @keyframes challengeShine{0%{left:-60%;}30%{left:130%;}100%{left:130%;}}
  .challenge-badge-live{

  .challenge-pool-label{

  /* OPTIMISATION (2026-08-23) : le bandeau de validation du coupon était en

  .scb-ring-fg{fill:none;stroke:url(#scbGradient);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .scb-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scb-ring-emoji{font-size:16px;animation:orbPulse 2s ease-in-out infinite;}
  .scb-right{position:relative;flex:1;min-width:0;}
  .scb-left{position:relative;display:flex;align-items:center;gap:9px;}
  .scb-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:liveDotPulse 1.4s ease-in-out infinite;flex-shrink:0;}
  .scb-label{font-size:11px;font-weight:800;color:#F5DFB0;letter-spacing:.03em;text-transform:uppercase;}
  .scb-timer{position:relative;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;
    background:linear-gradient(135deg,#FFE8A8,#F5B942);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:3px;}
  .scb-sub{font-size:11px;color:#CBAE85;font-weight:700;margin-top:4px;}
  /* Urgence : dernière heure de session */
  .session-countdown-banner.urgent{animation:urgentGlow 1.1s ease-in-out infinite;}
  @keyframes urgentGlow{0%,100%{box-shadow:0 10px 26px rgba(230,57,70,.35);}50%{box-shadow:0 10px 34px rgba(230,57,70,.7);}}
  .session-countdown-banner.urgent .scb-timer{background:linear-gradient(135deg,#FFC9C9,#E63946);-webkit-background-clip:text;background-clip:text;}
  .session-countdown-banner.urgent .scb-dot{background:var(--red);}

  /* ---------- Bannière : ouverture / fermeture des pronostics (contrôle admin) ---------- */
  .pred-countdown-banner{
    position:relative;overflow:hidden;margin:14px 20px 0;padding:12px 16px;border-radius:var(--radius-md);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(120deg,#0F7A37,#1E9E4A 55%,#0F7A37);box-shadow:0 8px 20px rgba(15,122,55,.3);
    animation:heroPop .4s ease;
  }
  .pred-countdown-banner.closed{background:linear-gradient(120deg,#7A1220,#B3202E 55%,#7A1220);box-shadow:0 8px 20px rgba(179,32,46,.35);}
  .pred-countdown-banner .pcb-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .pred-countdown-banner .pcb-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;animation:liveDotPulse 1.4s ease-in-out infinite;}
  .pred-countdown-banner .pcb-label{font-size:11px;font-weight:800;color:#fff;letter-spacing:.02em;line-height:1.25;}
  .pred-countdown-banner .pcb-sub{font-size:9.5px;color:rgba(255,255,255,.8);font-weight:700;margin-top:1px;}
  .pred-countdown-banner .pcb-timer{font-family:'Baloo 2';font-weight:800;font-size:16.5px;color:#fff;flex-shrink:0;letter-spacing:.02em;}

  .text-input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:var(--radius-sm);border:2px solid #EFE1C9;font-size:14px;font-family:inherit;}
  .text-input:focus{outline:none;border-color:var(--gold-deep);} 
  .win-banner{
    position:relative;overflow:hidden;text-align:center;margin:14px 20px 0;padding:22px 18px;
    border-radius:var(--radius-lg);color:#fff;
    background:linear-gradient(135deg,var(--gold) 0%,var(--orange) 55%,var(--green-deep) 130%);
    box-shadow:0 10px 26px rgba(217,119,6,.35);
    animation:winBannerPop .5s ease;
  }
  .win-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 45%),
               radial-gradient(circle at 85% 85%, rgba(255,255,255,.2), transparent 50%);
    animation:heroShine 3s ease-in-out infinite;
  }
  .win-banner .trophy{font-size:44px;position:relative;animation:winPop 1s ease-in-out infinite;display:inline-block;}
  .win-banner .amt{position:relative;font-family:'Baloo 2';font-weight:800;font-size:30px;margin-top:6px;text-shadow:0 2px 6px rgba(0,0,0,.2);}
  .win-banner .wtitle{position:relative;font-family:'Baloo 2';font-weight:800;font-size:16px;letter-spacing:.02em;}
  @keyframes winBannerPop{0%{transform:scale(.85);opacity:0;}60%{transform:scale(1.04);opacity:1;}100%{transform:scale(1);}}
  .lose-banner{
    background:linear-gradient(135deg,var(--cream-deep),#FFE6C8);border-radius:var(--radius-lg);
    padding:20px;text-align:center;margin-top:14px;color:var(--ink-soft);font-weight:700;
    animation:heroPop .4s ease;
  }
  .lose-banner .lose-emoji{font-size:28px;display:block;margin-bottom:6px;animation:heroBounce 2.2s ease-in-out infinite;}
  .almost-tag{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;margin-top:6px;animation:tagPulseGlow 1.6s ease-in-out infinite;}

  /* ---------- Chargement des résultats ---------- */
  .drawing-machine{
    position:relative;overflow:hidden;margin:14px 20px 0;padding:30px 20px 26px;border-radius:var(--radius-lg);text-align:center;
    background:linear-gradient(135deg,#2B1810,#4A2712 55%,#2B1810);box-shadow:0 14px 30px rgba(43,24,16,.4);
  }
  .drawing-machine::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 20% 20%, rgba(245,185,66,.3), transparent 45%),
               radial-gradient(circle at 85% 80%, rgba(242,102,29,.3), transparent 50%);
    animation:heroShine 2.2s ease-in-out infinite;
  }
  .dm-orb-wrap{position:relative;width:78px;height:78px;margin:0 auto 14px;}
  .dm-orb-ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), var(--orange), var(--gold-deep), var(--gold));
    animation:spinRing .9s linear infinite;box-shadow:0 0 24px rgba(245,185,66,.5);}
  .dm-orb-mask{position:absolute;inset:5px;border-radius:50%;background:#2B1810;display:flex;align-items:center;justify-content:center;font-size:28px;
    animation:orbPulse 1.1s ease-in-out infinite;}
  .dm-title{position:relative;font-family:'Baloo 2';font-weight:800;font-size:16px;color:#FFE8A8;}
  .dm-sub{position:relative;font-size:12px;font-weight:700;color:#CBAE85;margin-top:4px;}
  .dm-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 2px;animation:dmDotBounce 1s ease-in-out infinite;}
  .dm-dots span:nth-child(2){animation-delay:.15s;}
  .dm-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dmDotBounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-6px);opacity:1;}}


  /* ---------- History ---------- */
  .hist-item{background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:14px;margin:0 20px 10px;}
  .hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .hist-mode{font-family:'Baloo 2';font-weight:800;font-size:14px;}
  .hist-date{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .badge-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;}
  .badge-pill.win{background:#DFF6E4;color:var(--green-deep);}
  .badge-pill.pending{background:#FFEFCB;color:var(--gold-deep);}
  .badge-pill.almost{background:#FFE1D0;color:var(--orange);}
  .tabs{display:flex;gap:8px;margin:0 20px 14px;}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:99px;font-weight:800;font-size:13px;cursor:pointer;background:var(--white);box-shadow:var(--shadow);color:var(--ink-soft);}
  .tab.active{background:linear-gradient(135deg,var(--gold),var(--orange));color:#3a1a05;}
  .gain-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F3E7CC;}
  .gain-row:last-child{border:none;}
  .gain-row .amt{font-family:'Baloo 2';font-weight:800;color:var(--green-deep);}

  /* ---------- Referral / Abonnement ---------- */
  .code-box{
    background:linear-gradient(135deg,var(--ink),#4a2a15);border-radius:var(--radius-lg);padding:22px;text-align:center;
    margin:0 20px;color:#fff;
  }
  .code-box .code{font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--gold);letter-spacing:.06em;margin:8px 0 16px;}
  .share-row{display:flex;gap:8px;}
  .stat-row{display:flex;gap:10px;margin:16px 20px 0;}
  .stat-box{flex:1;background:var(--white);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px;text-align:center;}
  .stat-box .num{font-family:'Baloo 2';font-weight:800;font-size:19px;color:var(--gold-deep);}
  .stat-box .lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;}
  .filleul-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F3E7CC;}
  .filleul-row:last-child{border:none;}
  .dot-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-status.actif{background:var(--green);}
  .dot-status.inactif{background:#C9B896;}
  
  /* Défi 30 jours (teaser) */
  .challenge-teaser-card{
    margin:14px 20px 0;background:linear-gradient(135deg,#FFF3DA,#FFE3B0);
    border-radius:var(--radius-md);padding:16px;text-align:center;border:2px solid var(--gold-deep);
  }
  .challenge-teaser-card .ct-title{font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--gold-deep);}
  .challenge-teaser-card .ct-info{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:4px;}

  /* ---------- Défi hero (page Défis & Récompenses) ---------- */
  .mentor-hero{
    margin:0 20px;position:relative;overflow:hidden;border-radius:var(--radius-lg);
    background:radial-gradient(circle at 20% 0%, #C4B5FD 0%, transparent 55%),
               linear-gradient(150deg,#4C1D95,#6D28D9 45%,#D97706 130%);
    padding:24px 20px 22px;text-align:center;color:#fff;
    box-shadow:0 16px 34px rgba(76,29,149,.35);
  }
  .mentor-hero::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 82% 90%, rgba(245,185,66,.35), transparent 55%);
  }
  .mentor-hero-crown{font-size:38px;animation:heroBounce 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
  .mentor-hero-title{font-family:'Baloo 2';font-weight:800;font-size:19px;margin-top:6px;}
  .mentor-hero-sub{font-size:12.5px;opacity:.92;font-weight:700;margin-top:5px;line-height:1.45;max-width:280px;margin-left:auto;margin-right:auto;}
  .mentor-hero-rate-wrap{
    display:inline-flex;align-items:baseline;gap:4px;margin:16px 0 4px;
    background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);
    border-radius:99px;padding:10px 22px;backdrop-filter:blur(2px);
  }
  .mentor-hero-rate{font-family:'Baloo 2';font-weight:800;font-size:34px;color:var(--gold);animation:winPop 2.4s ease-in-out infinite;}
  .mentor-hero-rate-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;opacity:.95;}
  .mentor-hero-note{font-size:10.5px;font-weight:700;opacity:.85;margin-top:6px;}

  .mentor-steps{display:flex;gap:8px;margin:14px 20px 0;}
  .mentor-step{
    flex:1;background:var(--white);border-radius:var(--radius-sm);box-shadow:var(--shadow);
    padding:12px 8px;text-align:center;
  }
  .mentor-step .ms-ic{font-size:20px;}
  .mentor-step .ms-tx{font-size:10.5px;font-weight:800;color:var(--ink-soft);margin-top:4px;line-height:1.3;}
  .mentor-step .ms-num{
    display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;background:var(--purple);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:10.5px;margin-bottom:4px;
  }

  /* Progression du défi 30 buts / 30 jours */
  .challenge-progress-banner{
    margin:14px 20px 0;background:linear-gradient(135deg,#EAFBF0,#CFF3DB);border:2px solid var(--green-deep);
    border-radius:var(--radius-md);padding:14px 16px;
  }
  .challenge-progress-banner .cpb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .challenge-progress-banner .cpb-label{font-size:11.5px;font-weight:800;color:var(--green-deep);text-transform:uppercase;letter-spacing:.02em;}
  .challenge-progress-banner .cpb-count{font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--green-deep);}
  .challenge-progress-bar{width:100%;height:10px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:10px;overflow:hidden;}
  .challenge-progress-bar .fill{height:100%;border-radius:99px;background:linear-gradient(135deg,var(--green),var(--green-deep));transition:width .3s ease;}
  .challenge-progress-banner .cpb-days-left{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:8px;}

  .prize-claim-card{
    margin:16px 20px 0;background:linear-gradient(135deg,#FDE68A,#F59E0B);border-radius:var(--radius-md);
    padding:18px 16px;text-align:center;box-shadow:0 10px 24px rgba(245,158,11,.35);
  }
  .prize-claim-card .pc-title{font-family:'Baloo 2';font-weight:800;font-size:17px;color:#5A2E00;}
  .prize-claim-card .pc-sub{font-size:12px;color:#7A4300;font-weight:700;margin-top:4px;}

  .prize-history-row{
    display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F3E7CC;
  }
  .prize-history-row:last-child{border:none;}
  .prize-history-icon{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:linear-gradient(135deg,var(--gold),var(--orange));
  }
  .prize-history-body{flex:1;min-width:0;}
  .prize-history-body .ph-title{font-weight:800;font-size:13.5px;}
  .prize-history-body .ph-date{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:1px;}
  .prize-history-amount{font-family:'Baloo 2';font-weight:800;font-size:15px;color:var(--green-deep);flex-shrink:0;}
  .challenge-empty-state{padding:22px 10px;text-align:center;color:var(--ink-soft);font-weight:700;font-size:12.5px;}

  /* ---------- Défis entre joueurs (pools publiques, mise réelle) ---------- */
  .pvp-hero{
    position:relative;margin:14px 20px 0;overflow:hidden;border-radius:var(--radius-lg);padding:20px 18px;
    background:linear-gradient(135deg,#2B1810 0%,#5A2E00 55%,#D97706 130%);color:#fff;
    box-shadow:0 14px 30px rgba(217,119,6,.35);
  }
  .pvp-hero::after{
    content:'';position:absolute;top:-40%;right:-20%;width:70%;height:180%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.16),transparent);
    transform:skewX(-20deg);animation:challengeShine 5s ease-in-out infinite;pointer-events:none;
  }
  .pvp-hero-title{font-family:'Baloo 2';font-weight:800;font-size:19px;position:relative;z-index:1;}
  .pvp-hero-sub{font-size:12.5px;font-weight:700;color:#FCEBC9;margin-top:6px;line-height:1.45;position:relative;z-index:1;}
  .pvp-hero-btn{
    margin-top:14px;width:100%;border:none;border-radius:99px;padding:13px 16px;font-family:'Baloo 2';
    font-weight:800;font-size:14.5px;background:linear-gradient(135deg,var(--gold),#FFD873);color:#3a2013;
    box-shadow:0 8px 18px rgba(0,0,0,.25);position:relative;z-index:1;cursor:pointer;
  }
  .pvp-hero-btn:active{transform:scale(.98);}
  .pvp-section-title{
    display:flex;align-items:center;justify-content:space-between;margin:20px 20px 8px;
  }
  .pvp-section-title .st{font-family:'Baloo 2';font-weight:800;font-size:15px;}
  .pvp-section-title .live-count{font-size:11px;font-weight:800;color:var(--green-deep);display:flex;align-items:center;gap:5px;}
  .pvp-cat-tabs{display:flex;gap:8px;margin:10px 20px 12px;}
  .pvp-cat-tab{flex:1;border:2px solid #e5dfd2;background:#fff;border-radius:14px;padding:9px 6px;
    font-family:'Baloo 2';font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;}
  .pvp-cat-tab-sub{font-family:'Nunito';font-size:9.5px;font-weight:700;color:var(--ink-soft);}
  .pvp-cat-tab.active{background:linear-gradient(135deg,var(--gold),var(--orange));border-color:var(--orange);color:#3a1a05;}
  .pvp-cat-tab.active .pvp-cat-tab-sub{color:#5a2e05;}
  .pvp-list{display:flex;flex-direction:column;gap:12px;padding:0 20px;}
  .pvp-card{
    background:var(--white);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow);
    border:2px solid transparent;position:relative;overflow:hidden;
  }
  .pvp-card.mine{border-color:var(--gold-deep);}
  .pvp-card.locked{background:linear-gradient(135deg,#FFF7E9,#FCEBC9);}
  .pvp-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pvp-card-title{font-family:'Baloo 2';font-weight:800;font-size:14.5px;}
  .pvp-badge{
    font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 9px;border-radius:99px;
  }
  .pvp-badge.open{background:#DCFCE7;color:var(--green-deep);}
  .pvp-badge.locked{background:#FEF3C7;color:#92400E;}
  .pvp-badge.progress{background:#DBEAFE;color:#1D4ED8;}
  .pvp-badge.done{background:#F3E8FF;color:#6D28D9;}
  .pvp-card-meta{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .pvp-meta-item{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
  .pvp-pot{
    margin-top:10px;background:linear-gradient(135deg,#2B1810,#4a2a15);border-radius:14px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .pvp-pot .pl{font-size:10.5px;font-weight:800;color:#F5B942;text-transform:uppercase;letter-spacing:.03em;}
  .pvp-pot .pv{font-family:'Baloo 2';font-weight:800;font-size:17px;color:#fff;}
  .pvp-progress-bar{width:100%;height:9px;border-radius:99px;background:var(--cream-deep);margin-top:10px;overflow:hidden;}
  .pvp-progress-bar .fill{height:100%;border-radius:99px;background:linear-gradient(135deg,var(--orange),var(--gold-deep));transition:width .4s ease;}
  .pvp-spots-left{font-size:11px;font-weight:800;color:var(--orange);margin-top:6px;}
  .pvp-avatars{display:flex;margin-top:8px;}
  .pvp-avatar{
    width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--orange));
    display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--white);
    margin-left:-8px;box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .pvp-avatar:first-child{margin-left:0;}
  .pvp-card-btn{
    margin-top:12px;width:100%;border:none;border-radius:99px;padding:11px;font-family:'Baloo 2';font-weight:800;
    font-size:13.5px;cursor:pointer;
  }
  .pvp-card-btn.join{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;}
  .pvp-card-btn.view{background:var(--cream-deep);color:var(--ink);}
  .pvp-card-btn:disabled{opacity:.55;cursor:not-allowed;}
  /* Sélecteurs de chips (mise / joueurs / rounds) dans le sheet de création */
  .pvp-field-label{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin:16px 0 8px;}
  .pvp-chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pvp-chip{
    border:2px solid var(--cream-deep);background:var(--white);border-radius:99px;padding:9px 14px;
    font-family:'Baloo 2';font-weight:800;font-size:13px;color:var(--ink);cursor:pointer;
  }
  .pvp-chip.selected{border-color:var(--gold-deep);background:linear-gradient(135
